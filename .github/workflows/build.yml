name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java Manually
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          java -version

      - name: Setup Flutter Environment
        run: |
          git config --global advice.detachedHead false
          git clone https://github.com/flutter/flutter.git --branch 3.19.0 --depth 1 $HOME/flutter
          export PATH="$HOME/flutter/bin:$PATH"
          flutter --version

      - name: Create Android Platform Files
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter create . --org com.school.books --project-name school_app --platforms=android

      - name: Get dependencies
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter pub get

      - name: Build APK
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
