          fi

      - name: Configure Android Gradle for scheduled notifications
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/configure_android_gradle.py" <<'PY'
          from pathlib import Path
          import re

          root = Path("android/app")
          kts = root / "build.gradle.kts"
          groovy = root / "build.gradle"
          path = kts if kts.exists() else groovy if groovy.exists() else None
          if path is None:
              raise SystemExit("Android app Gradle file not found after project generation.")
          text = path.read_text(encoding="utf-8")

          if path.suffix == ".kts":
              text = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = maxOf(flutter.compileSdkVersion, 35)", text, count=1)
              if "isCoreLibraryDesugaringEnabled" not in text:
                  text, n = re.subn(r"(compileOptions\s*\{)", r"\1\n        isCoreLibraryDesugaringEnabled = true", text, count=1)
                  if n == 0:
                      raise SystemExit("compileOptions block not found in Kotlin Gradle file.")
              if "multiDexEnabled" not in text:
                  text, n = re.subn(r"(defaultConfig\s*\{)", r"\1\n        multiDexEnabled = true", text, count=1)
                  if n == 0:
                      raise SystemExit("defaultConfig block not found in Kotlin Gradle file.")
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              if "desugar_jdk_libs" not in text:
                  text, n = re.subn(r"(dependencies\s*\{)", lambda m: m.group(1) + "\n    " + dep, text, count=1)
                  if n == 0:
                      text += "\n\ndependencies {\n    " + dep + "\n}\n"
          else:
              text = re.sub(r"compileSdkVersion\s+flutter\.compileSdkVersion", "compileSdkVersion 35", text, count=1)
              text = re.sub(r"compileSdk\s+flutter\.compileSdkVersion", "compileSdk 35", text, count=1)
              if "coreLibraryDesugaringEnabled" not in text:
                  text, n = re.subn(r"(compileOptions\s*\{)", r"\1\n        coreLibraryDesugaringEnabled true", text, count=1)
                  if n == 0:
                      raise SystemExit("compileOptions block not found in Groovy Gradle file.")
              if "multiDexEnabled" not in text:
                  text, n = re.subn(r"(defaultConfig\s*\{)", r"\1\n        multiDexEnabled true", text, count=1)
                  if n == 0:
                      raise SystemExit("defaultConfig block not found in Groovy Gradle file.")
              dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
              if "desugar_jdk_libs" not in text:
                  text, n = re.subn(r"(dependencies\s*\{)", lambda m: m.group(1) + "\n    " + dep, text, count=1)
                  if n == 0:
                      text += "\n\ndependencies {\n    " + dep + "\n}\n"

          path.write_text(text, encoding="utf-8")
          print(f"Configured Android desugaring in {path}.")
          PY
          python3 "$RUNNER_TEMP/configure_android_gradle.py"

      - name: Configure Android manifest permissions and notification receivers
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/configure_android_manifest.py" <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          if not path.exists():
              raise SystemExit("AndroidManifest.xml not found after project generation.")
          text = path.read_text(encoding="utf-8")
          root_match = re.search(r"<manifest\b[^>]*>", text)
          if not root_match:
              raise SystemExit("Opening <manifest> tag not found in AndroidManifest.xml.")
          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.POST_NOTIFICATIONS",
          ]
          missing = [p for p in permissions if f'android:name="{p}"' not in text]
          if missing:
              tags = "".join(f'\n    <uses-permission android:name="{p}" />' for p in missing)
              text = text[:root_match.end()] + tags + text[root_match.end():]
          receivers = '''
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
          '''
          if "com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" not in text:
              if "</application>" not in text:
                  raise SystemExit("Closing </application> tag not found in AndroidManifest.xml.")
              text = text.replace("</application>", receivers + "\n    </application>", 1)
          path.write_text(text, encoding="utf-8")
          print("Updated Android manifest permissions and notification receivers.")
          PY
          python3 "$RUNNER_TEMP/configure_android_manifest.py"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze --no-pub
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iraqi-curriculum-library-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
