name: Build Iraqi Curriculum Library APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The source archive is the single source of truth for the app files.
      - name: Restore complete project from source archive
        shell: bash
        run: |
          if [ ! -f iraqi_curriculum_library_source.zip ]; then
            echo "ERROR: Upload iraqi_curriculum_library_source.zip to the repository root."
            exit 1
          fi
          unzip -oq iraqi_curriculum_library_source.zip -d .
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Project source restored."

      - name: Show Flutter version
        run: flutter --version

      - name: Recreate Android project from clean template
        shell: bash
        run: |
          rm -rf android
          flutter create --platforms=android --project-name=iraqi_curriculum_library --org=com.school.app .

      - name: Configure Android Gradle
        run: python3 tool/configure_android_gradle.py

      - name: Configure Android internet and notification permissions
        run: python3 tool/configure_android_manifest.py

      - name: Clean old build files
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK exists
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iraqi-curriculum-library-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

