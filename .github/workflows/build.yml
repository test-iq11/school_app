
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create Android project if missing
        shell: bash
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.school.app .
          fi

      - name: Enable Android core library desugaring
        shell: python
        run: |
          from pathlib import Path
          import re

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if kotlin.exists():
              path = kotlin
              is_kotlin = True
          elif groovy.exists():
              path = groovy
              is_kotlin = False
          else:
              raise SystemExit("Android Gradle file was not created.")

          text = path.read_text(encoding="utf-8")

          if is_kotlin:
              setting = "isCoreLibraryDesugaringEnabled = true"
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              setting = "coreLibraryDesugaringEnabled true"
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          if "isCoreLibraryDesugaringEnabled" not in text and "coreLibraryDesugaringEnabled" not in text:
              pattern = r"compileOptions\s*\{"
              text, count = re.subn(
                  pattern,
                  lambda m: m.group(0) + "\n        " + setting,
                  text,
                  count=1
              )
              if count == 0:
                  raise SystemExit("Could not find compileOptions block in " + str(path))

          if "desugar_jdk_libs" not in text:
              pattern = r"dependencies\s*\{"
              text, count = re.subn(
                  pattern,
                  lambda m: m.group(0) + "\n    " + dependency,
                  text,
                  count=1
              )
              if count == 0:
                  text += "\n\ndependencies {\n    " + dependency + "\n}\n"

          path.write_text(text, encoding="utf-8")
          print("Desugaring configured in", path)

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iraqi-curriculum-library-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
