name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Verify Flutter and Dart versions
        run: flutter --version

      - name: Generate Android project files if needed
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=iraqi_curriculum_library --org=iq.edu .
          fi

      # These scripts are included in the project ZIP under tool/.
      # Separate files avoid fragile inline Python heredocs in YAML.
      - name: Configure Android Gradle for scheduled notifications
        run: python3 tool/configure_android_gradle.py

      - name: Configure Android manifest permissions and receivers
        run: python3 tool/configure_android_manifest.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iraqi-curriculum-library-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
